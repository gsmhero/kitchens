name: Deploy to server

# Every push to main uploads the site over SSH with a dedicated deploy KEY (no password).
# Secrets (Settings -> Secrets and variables -> Actions):
#   SSH_PRIVATE_KEY  private half of the deploy key         SSH_KNOWN_HOSTS  the server's host key line(s), checked strictly
#   SSH_HOST  SSH_PORT  SSH_USER                            DEPLOY_PATH      web folder on the server ("." if the key is locked with rrsync)
# Optional variable:  SITE_URL  (e.g. https://yourdomain.com)  -> a smoke test checks that the site answers after deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read            # the workflow can only read the repository, nothing else

concurrency:
  group: deploy             # never two deployments at the same time
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # lets you restrict this job to main and add an approval in Settings -> Environments
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned to an exact commit
        with:
          persist-credentials: false

      - name: Check that the secrets exist
        env:
          K: ${{ secrets.SSH_PRIVATE_KEY }}
          H: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -n "$K" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$H" ] || missing="$missing SSH_KNOWN_HOSTS"
          [ -n "$HOST" ] || missing="$missing SSH_HOST"
          [ -n "$USER" ] || missing="$missing SSH_USER"
          [ -n "$DEST" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Prepare SSH (deploy key and pinned host key)
        env:
          K: ${{ secrets.SSH_PRIVATE_KEY }}
          H: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$H" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stamp the version into the script and style links
        run: |
          # The server lets browsers cache scripts and styles for a week. Putting the commit number in every link
          # (index.html itself is never cached) makes visitors fetch the new files right after a deploy.
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" index.html
          grep -c "?v=${GITHUB_SHA:0:8}" index.html

      - name: Upload the site
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Only the site files are uploaded; nothing is deleted on the server (no --delete).
          # StrictHostKeyChecking=yes: if the server's key is not the pinned one, the upload is refused.
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT:-22} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          rsync -rlptz --chmod=D755,F644 -e "$SSH" index.html .htaccess css js "$USER@$HOST:${DEST%/}/"
          echo "Uploaded."

      - name: Write the database settings on the server (outside the web folder)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ]; then echo "No database secrets yet: skipped."; exit 0; fi
          # Every value is base64-encoded, so passwords with quotes or $ signs cannot break the file.
          b64() { printf '%s' "$1" | base64 -w0; }
          printf "<?php\nreturn [\n  'db_host' => base64_decode('%s'),\n  'db_name' => base64_decode('%s'),\n  'db_user' => base64_decode('%s'),\n  'db_pass' => base64_decode('%s'),\n];\n" \
            "$(b64 "${DB_HOST:-localhost}")" "$(b64 "$DB_NAME")" "$(b64 "$DB_USER")" "$(b64 "$DB_PASS")" > /tmp/kitchens.config.php
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT:-22} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          # the file goes ONE LEVEL ABOVE the public web folder, readable only by the account itself (chmod 600)
          $SSH "$USER@$HOST" "umask 077; f=\"\$(dirname '${DEST%/}')/kitchens.config.php\"; cat > \"\$f\" && chmod 600 \"\$f\" && echo \"Database settings written to the folder above the web folder.\"" < /tmp/kitchens.config.php
          shred -u /tmp/kitchens.config.php 2>/dev/null || rm -f /tmp/kitchens.config.php

      - name: Check the database connection
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "$DB_NAME" ]; then echo "No database secrets yet: skipped."; exit 0; fi
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT:-22} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          $SSH "$USER@$HOST" "CFG=\"\$(dirname '${DEST%/}')/kitchens.config.php\" php" <<'PHP'
          <?php
          $c = include getenv('CFG');
          try {
            $pdo = new PDO('mysql:host=' . $c['db_host'] . ';dbname=' . $c['db_name'] . ';charset=utf8mb4', $c['db_user'], $c['db_pass'], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            echo 'Database connection OK, MySQL ' . $pdo->query('SELECT VERSION()')->fetchColumn() . PHP_EOL;
            echo 'Tables in the database: ' . $pdo->query('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()')->fetchColumn() . PHP_EOL;
          } catch (Throwable $e) {
            fwrite(STDERR, 'Database connection FAILED: ' . $e->getMessage() . PHP_EOL);
            exit(1);
          }
          PHP

      - name: Remove the key from the runner
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable not set: smoke test skipped."; exit 0; fi
          curl -fsSL --retry 5 --retry-delay 3 "$SITE_URL" | grep -q "Kitchens" && echo "Site answers and looks right: $SITE_URL"
